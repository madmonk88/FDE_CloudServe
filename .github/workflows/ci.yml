# Continuous integration.
#
# GitHub only reads workflows from .github/workflows/ at the repository root,
# and the runnable project lives one level down in 04_Source_Code/ because the
# submission guide mandates that four-folder layout. So this workflow sets
# working-directory and drives the nested project.
#
# 04_Source_Code/.github/workflows/ci.yml is the same pipeline in the location
# the guide requires inside the submitted repository. This file is what
# actually runs on pushes here.
#
# The suite runs with NO model provider key, deliberately. That makes CI a
# standing proof of acceptance criterion A11 — this is what the system does
# when the provider is gone — and it means the build never depends on a free
# tier being available at the moment someone pushes.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: 04_Source_Code

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 04_Source_Code/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for committed credentials
        # The brief: no credential, key or token may appear anywhere in
        # committed source. This fails the build rather than trusting a habit.
        working-directory: .
        run: |
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --exclude-dir=.git --exclude-dir=.venv --exclude-dir=storage . ; then
            echo "::error::a credential-shaped string is present in committed source"
            exit 1
          fi
          if find . -name ".env" -not -path "./.git/*" | grep -q . ; then
            echo "::error::.env is committed; it must be gitignored"
            exit 1
          fi
          echo "no credentials found in committed source"

      - name: Verify setup
        run: python -m scripts.verify_setup || true

      - name: Run tests
        env:
          OPENROUTER_API_KEY: ""
        run: python -m pytest tests/ -v --tb=short

      - name: Recover the routing policy from the labels
        # Reproduces the central analytical claim on every push: the routing
        # policy matches expected_route on 500/500 dev and 80/80 validation.
        run: python -m scripts.derive_policy

      - name: Prove the unattended run works without a provider
        env:
          OPENROUTER_API_KEY: ""
        run: |
          python -m evaluation.harness \
            --input data/validation_tickets.json \
            --output ci-results/
          test -f ci-results/metrics.json
          test -f ci-results/metrics.md
          python - <<'PY'
          import json
          report = json.load(open("ci-results/metrics.json"))
          assert report["run"]["completed_fully"], "the run did not finish"
          assert report["reconciliation"]["reconciles"], "the decision log does not reconcile"
          safety = report["safety"]
          assert safety["violations"] == 0, "a must_not_auto_respond ticket was auto-answered"
          print(
              f"unattended run complete: {report['volume']['tickets_processed']} tickets, "
              f"log reconciles, {safety['violations']} safety violations"
          )
          PY

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-results-py${{ matrix.python-version }}
          path: 04_Source_Code/ci-results/
